// Keybindery: a library and a mod in one, for chord keybinds and the keybind
// screens. It sits beside MenuKit and MenuKit: Containers:
//   :menukit            UI library
//   :menukit-containers slot extension
//   :keybindery         input and keybind screens (this project)
//
// What it does:
//   - an in-config keybind API for other mods (works with any UI library, and
//     does nothing when Keybindery is absent)
//   - a fallback that appends keybinds to vanilla, ModMenu and Cloth Config screens
//   - chords for any key mapping (a vanilla mixin into KeyMapping)
//   - a reworked Controls screen (search, sort, filter, the MISC fix)
//
// Vanilla mixins may use @Inject(at=HEAD, cancellable=true) followed by
// ci.cancel() instead of @Overwrite.
//
// Included from the root settings.gradle as `:keybindery`. Build with
// `./gradlew :keybindery:build`. Test with `./gradlew :keybindery:runClient`.

plugins {
    // The Loom plugin id is namespaced from 1.15 on; 1.17 is the line for 26.2.
    // The version is pinned at the workspace root.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('keybindery_version')
group   = property('maven_group')

base.archivesName = 'keybindery'

// Stamp the real mod version into fabric.mod.json at build time. The version
// used to be hardcoded as "1.0.0" in the manifest: bumping the Gradle version
// property renamed the jar, but the loader (which reads fabric.mod.json) still
// saw 1.0.0, so every published jar reported 1.0.0 and no versioned dependency
// on Keybindery could ever be met, which stopped dependent mods from booting.
// fabric.mod.json now declares "version": "${version}" and this block expands
// it from the project version, so there is one source of truth.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // ModMenu shows Keybindery's own YACL config screen in the mods list.
    // Optional at runtime; it is compileOnly so players can leave ModMenu out
    // without crashing Keybindery.
    maven { url 'https://maven.terraformersmc.com/releases/' }
    // YACL is the config-screen framework for Keybindery's own settings (the
    // Simultaneous Mode toggle and window). It is bundled with Loom's
    // `include`, so players install Keybindery and get YACL with it.
    // isxander's own Maven stops at the 3.8.x line; the 26.2 builds (3.9.x)
    // are only on this Maven repository.
    maven { url 'https://api.modrinth.com/maven' }
}

// Since 6.0.0 MenuKit has separate main and client source sets. A project
// dependency sees only main, so its client half is added by output (in the
// client dependencies after loom {}), which needs MenuKit evaluated first.
evaluationDependsOn(':menukit')

dependencies {
    // 26.x: the game is unobfuscated, so there is no mappings line, and mod deps
    // use the standard Java configurations (implementation, not modImplementation).
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // YACL: `include` bundles it into the release jar; its compile line is a
    // client dependency, after loom {}.
    include        "maven.modrinth:yacl:3.9.6+26.2-fabric"

    // @ApiStatus.Internal markers and similar annotations. compileOnly so
    // consumer mods don't depend on jetbrains-annotations at runtime through
    // Keybindery. The annotations are only for docs and the IDE.
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // Keybindery API: a separate jar with the public interface (independent
    // of any UI library) and the Chord value class. Added through the `api`
    // configuration, so consumer mods that depend on :keybindery also get the
    // api types, the same as `modCompileOnly` on keybindery-api directly.
    // Consumer mods can depend on keybindery-api alone for compile-time
    // access without bundling Keybindery itself, and the API does nothing at
    // runtime when Keybindery is missing, so they never crash without it.
    // (26.x has no remapping, so the `namedElements` variant is gone and a
    // plain project dep is the real artifact.)
    api project(':keybindery-api')

    // Bundle keybindery-api so a player who installs only the Keybindery jar
    // gets the api types and the YACL widget code at runtime, without a
    // separate keybindery-api download. (If a consumer mod bundles
    // keybindery-api too, Fabric resolves the duplicate mod id by picking the
    // newest version, which is safe.)
    //
    // Before 26.x the bundled jar had to be the remapped jar, never
    // `namedElements`. With remapping gone that risk is gone too: the plain
    // project dep is the shippable jar.
    include project(":keybindery-api")

    // MenuKit: the Controls screen toolbar uses MenuKit Dropdown widgets and
    // VanillaScreenPanelAdapter to put them on the vanilla KeyBindsScreen. A
    // hard dependency, because the toolbar is central to the Controls screen.
    // MenuKit is split since 6.0.0: the project dep is its common half, and the
    // client half (Dropdown, panels, adapters) is added by output below.
    implementation project(':menukit')
}

loom {
    // Keybindery is universal so universal mods that depend on it (Inventory
    // Plus, Inventory Max) start on a dedicated server. All of Keybindery is
    // client code in src/client; src/main holds only the empty common
    // entrypoint. The compiler refuses a main class that reaches a client one.
    splitEnvironmentSourceSets()
    mods {
        keybindery {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // 26.2: KeyBindsList.KeyEntry's constructor went private; KeybinderyKeyEntry
    // subclasses it. See the .accesswidener file for the rationale.
    accessWidenerPath = file("src/main/resources/keybindery.accesswidener")

    runs {
        client { ideConfigGenerated = false }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh <mod> <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
        server { ideConfigGenerated = false }
    }
}

// Client-only dependencies, after loom {} so its client configurations exist.
dependencies {
    // MenuKit's client half, which the project dep above leaves out.
    clientImplementation rootProject.project(':menukit').sourceSets.client.output

    // ModMenu, a soft dependency. compileOnly means Keybindery compiles against
    // ModMenu's API; localRuntime brings it into the dev launch so the in-game
    // mod list shows Keybindery's config screen entry. ModMenu has had stable
    // 26.2 builds since 20.0.0, and this is 20.0.1. Keybindery's
    // @Mixin(ModMenu.class) must keep working against it.
    clientCompileOnly "com.terraformersmc:modmenu:20.0.1"
    localRuntime "com.terraformersmc:modmenu:20.0.1"

    // YACL, Keybindery's config-screen framework. Compile and dev runtime
    // here; the `include` above bundles it into the release jar (Jar-in-Jar),
    // so players don't need to install YACL separately.
    clientImplementation "maven.modrinth:yacl:3.9.6+26.2-fabric"
}

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// Keybindery — Modrinth project id Ufxx9AC2. Lead @ Trevlar Mods owns the
// publish (§0032). v1.0.1 = JiJ-remap bugfix over the broken, still-live v1.0.0.
// Declares menukit required: keybindery has a hard runtime dep on it (F4
// controls-screen toolbar), `implementation` (not `include`) above.
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "Ufxx9AC2"
    versionNumber = property('keybindery_version')
    versionName = "Keybindery ${property('keybindery_version')}"
    versionType = "release"
    // ci-cd.md stage 5: the player-facing changelog lives in changelog.md, one entry,
    // overwritten each release (git keeps the history). Hardcoding it here went stale.
    changelog = file('changelog.md').text
    // ci-cd.md stage 7: the README is the public description; `modrinthSyncBody` pushes it.
    syncBodyFrom = file('README.md').text
    // 26.x: no remap step — `jar` IS the shippable artifact (remapJar is gone).
    uploadFile = jar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "menukit"
    }
}

// The shipped jar must report the bumped version itself. A jar that
// says the wrong version silently breaks every dependency gate against it, so this
// fails the build instead of relying on someone remembering to unzip and look.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion

// This mod must pin MenuKit to the major it was built against.
// The floor guarantees every MenuKit call it makes exists at load time; the ceiling stops a
// future breaking major from loading against code that never saw it. Both halves matter:
// a floor alone lets MenuKit 6.0.0 rename an API out from under a shipped jar, and the
// player gets a NoSuchMethodError hours into a session instead of a refusal at launch.
// Commas are rejected outright: Fabric parses ">=5.0.0,<6.0.0" without complaint and the
// resulting predicate then matches NO version at all, which silently disables the mod.
tasks.register('verifyMenuKitRange') {
    def src = file('src/main/resources/fabric.mod.json')
    def mkVersion = (project.findProperty('menukit_version') ?: '').toString()
    inputs.file src
    inputs.property 'menukit_version', mkVersion
    doLast {
        // Floor at major.minor, not just major: a minor can add API (MenuKit 5.1.0 added
        // SlotOperations/SlotGroups) that a consumer built against it calls. Flooring at the
        // major alone would let that jar load on the unrelated 5.0.0 and die with
        // NoSuchMethodError, which is exactly the failure this check exists to prevent.
        def parts = mkVersion.replaceAll(/\+.*$/, '').tokenize('.')
        def major = Integer.parseInt(parts[0])
        def minor = Integer.parseInt(parts[1])
        def expected = ">=${major}.${minor}.0 <${major + 1}.0.0".toString()
        def depends = new groovy.json.JsonSlurper().parse(src).depends ?: [:]
        ['menukit', 'menukit-containers'].each { id ->
            def declared = depends[id]?.toString()
            if (declared == null) return
            if (declared.contains(',')) {
                throw new GradleException(
                    "fabric.mod.json: '${id}' is '${declared}'. Fabric accepts a comma here and the " +
                    "predicate then matches no version at all. Separate the bounds with a space.")
            }
            if (declared != expected) {
                throw new GradleException(
                    "fabric.mod.json: '${id}' is '${declared}', expected '${expected}'. This mod is " +
                    "built against MenuKit ${mkVersion}, so it floors at that major.minor and stops " +
                    "below the next major. See guidelines/ci-cd.md, 'MenuKit version pinning'.")
            }
        }
        println "verifyMenuKitRange: menukit '${expected}' (built against ${mkVersion})"
    }
}
build.dependsOn verifyMenuKitRange
