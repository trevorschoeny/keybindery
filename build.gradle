// ═══════════════════════════════════════════════════════════════════════════
// Keybindery — hybrid library + consumer mod for chord keybinds and keybind
// UX. Established as a sub-unit of @ Trevlar Mods per §0030. Sibling to
// MenuKit and MKC under the same domain-partition logic (§0042):
//   :menukit            → UI library
//   :menukit-containers → slot extension
//   :keybindery         → input augmentation + keybind UX (this artifact)
//
// v1.0.0 scope:
//   F1 — In-config keybind API for consumer mods (UI-lib-agnostic, silent-fail)
//   F2 — Auto-append fallback in vanilla / ModMenu / Cloth Config screens
//   F3 — Chord-for-any-keymapping (vanilla mixin into KeyMapping)
//   F4 — Controls-screen overhaul (search, sort, filter, MISC fix)
//
// Per §0003 (this unit's canon): vanilla mixins may use
// @Inject(at=HEAD, cancellable=true) followed by ci.cancel() as a
// §0030-compliant alternative to @Overwrite.
//
// Section 1a (Imp's first commit): scaffolding only — mod loads in MC dev
// runtime with no chord logic yet. F3 work imports from MK's existing
// chord-keybind implementation (per Trev's migration directive, 2026-05-18).
//
// Workspace integration: included from the root settings.gradle as
// `:keybindery`. Build with `./gradlew :keybindery:build`. Test with
// `./gradlew :keybindery:runClient`.
// ═══════════════════════════════════════════════════════════════════════════

plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'java'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('keybindery_version')
group   = property('maven_group')

base.archivesName = 'keybindery'

// Stamp the real mod version into fabric.mod.json at build time. The version
// used to be HARDCODED "1.0.0" in the manifest — bumping the gradle version
// property renamed the JAR but the loader (which reads fabric.mod.json) still
// saw 1.0.0, so every published artifact self-reported 1.0.0 and no versioned
// dependency gate could ever be satisfied (the 2026-07-01 Keybindery boot
// wall). fabric.mod.json now declares "version": "${version}" and this block
// expands it from the project version — one source of truth.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // ModMenu — surfaces Keybindery's own YACL config screen on the mods
    // list. Optional at runtime; declared compileOnly here so consumers
    // can omit ModMenu without crashing Keybindery.
    maven { url 'https://maven.terraformersmc.com/releases/' }
    // YACL — config-screen framework used for Keybindery's own settings
    // (Simultaneous Mode toggle + window). JIJ'd via Loom's `include` so
    // players install Keybindery and YACL comes along bundled.
    maven { url 'https://maven.isxander.dev/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // ModMenu — soft dep. compileOnly here means Keybindery compiles
    // against ModMenu's API; modLocalRuntime brings it into the dev launch
    // so the in-game mod list shows Keybindery's config screen entry.
    modCompileOnly "com.terraformersmc:modmenu:17.0.0"
    modLocalRuntime "com.terraformersmc:modmenu:17.0.0"

    // YACL — Keybindery's chosen config-screen framework. Bundled into
    // Keybindery's jar via Loom's `include` (Jar-in-Jar), so players don't
    // need to install YACL separately. `modImplementation` covers compile
    // + dev runtime; `include` is what JIJs YACL into the release jar.
    modImplementation "dev.isxander:yet-another-config-lib:3.8.1+1.21.11-fabric"
    include          "dev.isxander:yet-another-config-lib:3.8.1+1.21.11-fabric"

    // @ApiStatus.Internal markers and similar annotations. compileOnly so
    // consumer mods don't transitively depend on jetbrains-annotations at
    // runtime — the annotations are doc/IDE signals only.
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // Keybindery API (F1) — separate jar holding the public, UI-library-
    // agnostic interface and the Chord value class. Used via `api` config
    // so consumer mods depending on :keybindery transitively get the api
    // types in scope, matching what they'd get from `modCompileOnly` on
    // keybindery-api directly. Per Trev's silent-fail directive, consumer
    // mods can depend on keybindery-api ALONE for compile-time access
    // without bundling keybindery main at runtime.
    api project(path: ':keybindery-api', configuration: 'namedElements')

    // JIJ keybindery-api so a player who installs only keybindery (main)
    // jar gets the api types and the YACL widget code path at runtime
    // without needing a separate keybindery-api download. (Consumer mods
    // that ALSO JIJ keybindery-api: Fabric handles duplicate-mod-id by
    // picking the newest version — safe.)
    //
    // JIJ the REMAPPED jar (bare `project(...)`), NOT the `namedElements`
    // variant. `namedElements` is the dev (Mojmap) artifact — correct for the
    // `api` compile dep above, but bundling it nests un-remapped Mojmap class
    // refs (e.g. net.minecraft.network.chat.Component) that don't exist in a
    // production intermediary runtime. That's invisible in the Mojmap dev
    // launch but a hard NoClassDefFoundError on startup in any real install.
    include project(":keybindery-api")

    // MenuKit — F4 controls-screen toolbar uses MK Dropdown widgets and
    // VanillaScreenPanelAdapter to host them on the vanilla KeyBindsScreen.
    // Hard dependency rather than soft because the toolbar is core to F4.
    implementation project(path: ':menukit', configuration: 'namedElements')
}

loom {
    runs {
        client { ideConfigGenerated = false }
        server { ideConfigGenerated = false }
    }
}

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// Keybindery — Modrinth project id Ufxx9AC2. Lead @ Trevlar Mods owns the
// publish (§0032). v1.0.1 = JiJ-remap bugfix over the broken, still-live v1.0.0.
// Declares menukit required: keybindery has a hard runtime dep on it (F4
// controls-screen toolbar), `implementation` (not `include`) above.
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "Ufxx9AC2"
    versionNumber = property('keybindery_version')
    versionName = "Keybindery ${property('keybindery_version')}"
    versionType = "release"
    changelog = '''Keybindery 1.0.2

Updated for MenuKit 2.0. Keybindery now requires MenuKit 2.0.0 or newer (a separate download).'''
    uploadFile = remapJar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "menukit"
    }
}
